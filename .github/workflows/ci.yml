name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install quality and security tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --disable-pip-version-check --user jsonschema==4.25.1
          npm install --global markdownlint-cli2@0.24.2

          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

          curl --fail --silent --show-error --location \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/lychee.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  /tmp/lychee.tar.gz" | sha256sum --check
          mkdir -p /tmp/lychee-extract
          tar -xzf /tmp/lychee.tar.gz -C /tmp/lychee-extract
          LYCHEE_BIN="$(find /tmp/lychee-extract -type f -name lychee -print -quit)"
          test -n "$LYCHEE_BIN"
          sudo install "$LYCHEE_BIN" /usr/local/bin/lychee

          curl --fail --silent --show-error --location \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/zizmor.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  /tmp/zizmor.tar.gz" | sha256sum --check
          mkdir -p /tmp/zizmor-extract
          tar -xzf /tmp/zizmor.tar.gz -C /tmp/zizmor-extract
          ZIZMOR_BIN="$(find /tmp/zizmor-extract -type f -name zizmor -print -quit)"
          test -n "$ZIZMOR_BIN"
          sudo install "$ZIZMOR_BIN" /usr/local/bin/zizmor

          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          mkdir -p /tmp/gitleaks-extract
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-extract
          GITLEAKS_BIN="$(find /tmp/gitleaks-extract -type f -name gitleaks -print -quit)"
          test -n "$GITLEAKS_BIN"
          sudo install "$GITLEAKS_BIN" /usr/local/bin/gitleaks

      - name: Validate repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/validate-repo.sh
